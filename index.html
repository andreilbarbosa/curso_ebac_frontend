<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Cadastro - EBAC</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container header">
        <div class="row">
            <div class="col-md-12 d-flex justify-content-center">
                <div class="titulo h1">
                    Formulário de Cadastro
                </div>
            </div>
        </div>
    </div>
    <div class="container form">
        <div class="row">
            <div class="col-md-12">
                <form>
                    <label class="form-label h5" for="name">Digite seu nome:</label>
                    <input class="form-control form-control-sm" type="text" id="name" required />
                    <label class="form-label h5" for="telefone">Digite seu telefone:</label>
                    <input class="form-control form-control-sm" type="tell" id="telefone" required />
                    <label class="form-label h5" for="email">Digite seu email:</label>
                    <input class="form-control form-control-sm" type="email" id="email" required />
                    <button class="btn btn-outline-primary">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
