<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List - EBAC</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <header>
        <h2>Lista de Tarefas</h2>
        <h4>Adicione suas tarefas e administre seu tempo</h4>
    </header>
    <main>
        <div class="container">
            <div class="box">
                <form>
                    <input type="text" id="input-tarefa" required placeholder="Digite sua tarefa" />
                    <button type="submit" id="botao-enviar">+</button>
                </form>
                <ul>
                    <li>
                        <form class="atividade">
                            <p>Estudar</p>
                            <input type="checkbox"/>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </main>
    <script src="./main.js"></script>
</body>
</html>
