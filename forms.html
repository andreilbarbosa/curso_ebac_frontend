<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <h2>Formulário de Cadastro</h2><br />
    <label for="Nome">Nome</label>
    <input id="Nome" type="text" placeholder="ex:fulano_beltrano"><br />
    <label for="Email">Email</label>
    <input id="Email" type="email" placeholder="ex:beltrano12@exemplo.com"><br />
    <label for="Senha">Senha</label>
    <input id="Senha" type="password" placeholder="ex:123fu123"><br />
    <button>Cadastrar</button>
    
</body>
</html>
